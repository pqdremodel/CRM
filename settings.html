<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PQD CRM">
    <title>Settings - PQD Remodels</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- iOS PWA Link Fix -->
    <script>
        if (("standalone" in window.navigator) && window.navigator.standalone) {
            document.addEventListener('click', function(e) {
                var a = e.target.closest('a');
                if (a && a.href && !a.hasAttribute('download') && a.target !== '_blank') {
                    e.preventDefault();
                    window.location = a.href;
                }
            }, false);
        }
    </script>
</head>
<body>
    <div class="dashboard-container">
        
        <!-- Mobile Header -->
        <div class="mobile-header">
            <button id="global-back-btn" onclick="history.length > 1 ? history.back() : window.location.href='index.html'" style="background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer;"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Flame_icon.svg" alt="Flame" class="logo-icon" width="24" height="24" style="filter: invert(65%) sepia(85%) saturate(1915%) hue-rotate(345deg) brightness(102%) contrast(105%);">
                <span class="logo-text" style="color: var(--primary-color);">PQD Remodels</span>
            </div>
            <button id="mobile-menu-btn" style="background: none; border: none; font-size: 24px; color: var(--primary-color); cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
        </div>
    
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Flame_icon.svg" alt="Flame" class="logo-icon" width="24" height="24" style="filter: invert(65%) sepia(85%) saturate(1915%) hue-rotate(345deg) brightness(102%) contrast(105%);">
                    <span class="logo-text">PQD Remodels</span>
                    <i class="fa-solid fa-arrow-up-right-from-square logo-arrow"></i>
                </div>
            </div>
            
            <div class="sidebar-search">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" placeholder="Search Anything">
                <span class="shortcut">⌘ K</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="section-title">
                        <i class="fa-solid fa-caret-down"></i> General
                    </div>
                    <ul>
                        <li onclick="window.location.href='index.html'">
                            <i class="fa-solid fa-building icon"></i>
                            <span>Clients</span>
                        </li>
                        <li onclick="window.location.href='leads.html'">
                            <i class="fa-solid fa-user-plus icon"></i>
                            <span>Leads</span>
                        </li>
                        <li onclick="window.location.href='calendar.html'">
                            <i class="fa-regular fa-calendar icon"></i>
                            <span>Calendar</span>
                        </li>
                        <li onclick="window.location.href='messages.html'">
                            <i class="fa-regular fa-message icon"></i>
                            <span>Messages</span>
                        </li>
                    </ul>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="footer-nav">
                    <ul>
                        <li class="active" onclick="window.location.href='settings.html'">
                            <i class="fa-solid fa-gear icon"></i>
                            <span>Settings</span>
                        </li>
                        <li>
                            <i class="fa-regular fa-bell icon"></i>
                            <span>Notifications</span>
                        </li>
                    </ul>
                </div>
                <div class="user-profile">
                    <div class="avatar">
                        <img src="https://ui-avatars.com/api/?name=User&background=e0e0e0&color=333" id="profile-avatar" alt="Profile">
                    </div>
                    <div class="user-info">
                        <span class="name">Team Member</span>
                        <span class="email" id="profile-email">Loading...</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-from-bracket more-opts" id="logout-btn" title="Sign Out"></i>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div style="font-size: 20px; font-weight: 600; color: var(--text-main);">Settings</div>
            </header>

            <div style="padding: 24px; max-width: 600px;">
                <div style="background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <style>
                        #avatar-container:hover #avatar-overlay { opacity: 1 !important; }
                    </style>
                    <h2 style="margin-bottom: 24px; font-size: 18px; color: var(--text-main);">User Profile</h2>
                    
                    <form id="settings-form">
                        <div style="display: flex; gap: 24px; align-items: flex-start; margin-bottom: 24px;">
                            <div style="text-align: center;">
                                <div id="avatar-container" style="width: 100px; height: 100px; border-radius: 50%; background: #e0e0e0; overflow: hidden; margin-bottom: 12px; position: relative;">
                                    <img id="settings-avatar-preview" src="" style="width: 100%; height: 100%; object-fit: cover;">
                                    <div id="avatar-overlay" style="position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity 0.2s;">
                                        <i class="fa-solid fa-camera" style="color: white; font-size: 24px;"></i>
                                    </div>
                                    <input type="file" id="settings-avatar-input" accept="image/*" style="display: none;">
                                </div>
                                <div style="font-size: 12px; color: var(--text-muted);">Profile Photo</div>
                            </div>
                            
                            <div style="flex: 1;">
                                <div style="display: flex; gap: 16px; margin-bottom: 16px;">
                                    <div class="form-group" style="flex: 1;">
                                        <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted);">First Name</label>
                                        <input type="text" id="settings-first-name" required style="width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px;">
                                    </div>
                                    
                                    <div class="form-group" style="flex: 1;">
                                        <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted);">Last Name</label>
                                        <input type="text" id="settings-last-name" style="width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px;">
                                    </div>
                                </div>
                                
                                <div class="form-group" style="margin-bottom: 24px;">
                                    <label style="display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted);">Email Address (Read Only)</label>
                                    <input type="email" id="settings-email" disabled style="width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background: #f5f5f5; color: #888;">
                                </div>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary" id="settings-save-btn">Save Changes</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Auth Check & Core Scripts -->
    <script src="supabase.js"></script>
    <script src="settings.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('mobile-menu-btn');
            const sidebar = document.querySelector('.sidebar');
            if (menuBtn && sidebar) {
                menuBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('mobile-open');
                });
                
                // Close sidebar when clicking outside
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768 && !sidebar.contains(e.target) && !menuBtn.contains(e.target) && sidebar.classList.contains('mobile-open')) {
                        sidebar.classList.remove('mobile-open');
                    }
                });
            }
        });
    </script>
</body>

</html>
