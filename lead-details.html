<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PQD CRM">
    <title>Project Details - PQD Remodels</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- iOS PWA Link Fix -->
    <script>
        if (("standalone" in window.navigator) && window.navigator.standalone) {
            document.addEventListener('click', function(e) {
                var a = e.target.closest('a');
                if (a && a.href && !a.hasAttribute('download') && a.target !== '_blank') {
                    e.preventDefault();
                    window.location = a.href;
                }
            }, false);
        }
    </script>
</head>
<body>
    <div class="dashboard-container">
        
        <!-- Mobile Header -->
        <div class="mobile-header">
            <button id="global-back-btn" onclick="history.length > 1 ? history.back() : window.location.href='index.html'" style="background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer;"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Flame_icon.svg" alt="Flame" class="logo-icon" width="24" height="24" style="filter: invert(65%) sepia(85%) saturate(1915%) hue-rotate(345deg) brightness(102%) contrast(105%);">
                <span class="logo-text" style="color: var(--primary-color);">PQD Remodels</span>
            </div>
            <button id="mobile-menu-btn" style="background: none; border: none; font-size: 24px; color: var(--primary-color); cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
        </div>
    
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Flame_icon.svg" alt="Flame" class="logo-icon" width="24" height="24" style="filter: invert(65%) sepia(85%) saturate(1915%) hue-rotate(345deg) brightness(102%) contrast(105%);">
                    <span class="logo-text">PQD Remodels</span>
                    <i class="fa-solid fa-arrow-up-right-from-square logo-arrow"></i>
                </div>
            </div>
            
            <div class="sidebar-search">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" placeholder="Search Anything">
                <span class="shortcut">⌘ K</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="section-title">
                        <i class="fa-solid fa-caret-down"></i> General
                    </div>
                    <ul>
                        <li onclick="window.location.href='index.html'">
                            <i class="fa-solid fa-building icon"></i>
                            <span>Clients</span>
                        </li>
                        <li class="active" onclick="window.location.href='leads.html'">
                            <i class="fa-solid fa-user-plus icon"></i>
                            <span>Leads</span>
                        </li>
                        <li onclick="window.location.href='calendar.html'">
                            <i class="fa-regular fa-calendar icon"></i>
                            <span>Calendar</span>
                        </li>
                        <li onclick="window.location.href='messages.html'">
                            <i class="fa-regular fa-message icon"></i>
                            <span>Messages</span>
                        </li>
                    </ul>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="footer-nav">
                    <ul>
                        <li onclick="window.location.href='settings.html'">
                            <i class="fa-solid fa-gear icon"></i>
                            <span>Settings</span>
                        </li>
                        <li>
                            <i class="fa-regular fa-bell icon"></i>
                            <span>Notifications</span>
                        </li>
                    </ul>
                </div>
                <div class="user-profile">
                    <div class="avatar">
                        <img src="https://ui-avatars.com/api/?name=User&background=e0e0e0&color=333" id="profile-avatar" alt="Profile">
                    </div>
                    <div class="user-info">
                        <span class="name">Team Member</span>
                        <span class="email" id="profile-email">Loading...</span>
                    </div>
                    <i class="fa-solid fa-arrow-right-from-bracket more-opts" id="logout-btn" title="Sign Out"></i>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" style="background: transparent; border: none; box-shadow: none;">
    <div class="project-header">
        <div class="project-title" style="position: relative;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <h1 id="lead-name-display" style="margin: 0;">Loading...</h1>
                <button id="btn-edit-lead" class="btn btn-outline" style="padding: 4px 8px; font-size: 12px; height: 28px;"><i class="fa-solid fa-pen"></i> Edit</button>
            </div>
            <h2 id="lead-type-display" style="margin-top: 4px;">...</h2>
            <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
                <span class="status-badge" id="lead-status-display">Status</span>
                <span style="color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px;"><i class="fa-solid fa-envelope"></i> <span id="lead-email-display"></span></span>
                <span style="color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px;"><i class="fa-solid fa-phone"></i> <span id="lead-phone-display"></span></span>
                <span style="color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px;"><i class="fa-solid fa-location-dot"></i> <span id="lead-address-display">No Address</span></span>
            </div>
        </div>
        <div class="project-actions">
            <span id="save-indicator" style="color: var(--text-muted); font-size: 14px; margin-right: 16px; opacity: 0; transition: opacity 0.3s;">Saved</span>
        </div>
    </div>

    <div class="grid-layout" style="grid-template-columns: 1fr; margin-top: 24px;">
        <div class="card" id="main-address-card" style="display: none;">
            <div class="card-header">
                <h3>ADDRESS</h3>
            </div>
            <div class="card-body">
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="position: relative;">
                        <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">Street Address</label>
                        <input type="text" id="main-address-street" placeholder="123 Main St" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;" autocomplete="off">
                        <div id="main-address-suggestions" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border-color); border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
                    </div>
                    <div style="display: flex; gap: 12px;">
                        <div style="flex: 2;">
                            <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">City</label>
                            <input type="text" id="main-address-city" placeholder="City" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                        </div>
                        <div style="flex: 1;">
                            <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">State</label>
                            <input type="text" id="main-address-state" placeholder="State" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                        </div>
                        <div style="flex: 1;">
                            <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">ZIP</label>
                            <input type="text" id="main-address-zip" placeholder="ZIP" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                        </div>
                    </div>
                </div>
                <button id="btn-add-main-address" class="btn btn-primary" style="margin-top: 16px; width: 100%; justify-content: center;"><i class="fa-solid fa-location-arrow" style="margin-right: 6px;"></i> Add Address</button>
            </div>
        </div>
        <div class="card">
            <div class="card-header">
                <h3>SCHEDULE CONSULTATION</h3>
            </div>
            <div class="card-body">
                <div id="scheduled-event-display" style="display: none; padding: 16px; background: #e3f2fd; border-radius: 8px; margin-bottom: 16px;">
                    <h4 style="margin: 0; color: #1976d2;"><i class="fa-regular fa-calendar-check"></i> Scheduled Consultation</h4>
                    <p id="scheduled-datetime-text" style="margin: 4px 0 0 0; font-size: 14px; color: #1565c0;"></p>
                    <button id="btn-show-reschedule" class="btn btn-outline" style="margin-top: 12px; font-size: 12px; padding: 6px 12px; border-color: #1976d2; color: #1976d2;">Reschedule</button>
                </div>
                <div id="schedule-form-container">
                    <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                        <div style="flex: 1;">
                            <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">Date</label>
                            <input type="date" id="consultation-date" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                        </div>
                        <div style="flex: 1;">
                            <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">Time</label>
                            <input type="time" id="consultation-time" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;">
                        </div>
                    </div>
                    <button class="btn btn-outline" id="btn-schedule" style="width: 100%; justify-content: center;"><i class="fa-regular fa-calendar"></i> Add to Calendar</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>NOTES</h3>
            </div>
            <div class="card-body">
                <textarea id="lead-notes" placeholder="Add notes about this lead here..." style="width: 100%; height: 200px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; resize: vertical; font-family: inherit;"></textarea>
            </div>
        </div>
    </div>
</main>
    </div>
    
    <!-- Edit Lead Modal -->
    <div id="edit-lead-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 12px; width: 90%; max-width: 400px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0;">Edit Lead Info</h3>
                <i class="fa-solid fa-xmark" id="btn-close-edit-modal" style="cursor: pointer; color: var(--text-muted); font-size: 20px;"></i>
            </div>
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <div>
                    <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">Name</label>
                    <input type="text" id="edit-lead-name" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">Email</label>
                    <input type="email" id="edit-lead-email" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">Phone</label>
                    <input type="text" id="edit-lead-phone" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">Status</label>
                    <select id="edit-lead-status" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                        <option value="New">New</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Qualified">Qualified</option>
                        <option value="Lost">Lost</option>
                    </select>
                </div>
                </div>
                
                <h4 style="margin: 8px 0 0 0; border-top: 1px solid #eee; padding-top: 16px;">Address</h4>
                <div style="position: relative;">
                    <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">Street Address</label>
                    <input type="text" id="lead-address-street" placeholder="123 Main St" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;" autocomplete="off">
                    <div id="address-suggestions" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border-color); border-radius: 6px; max-height: 150px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div style="flex: 2;">
                        <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">City</label>
                        <input type="text" id="lead-address-city" placeholder="City" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">State</label>
                        <input type="text" id="lead-address-state" placeholder="State" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                    </div>
                    <div style="flex: 1;">
                        <label style="display: block; margin-bottom: 4px; font-size: 12px; color: var(--text-muted);">ZIP</label>
                        <input type="text" id="lead-address-zip" placeholder="ZIP" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                    </div>
                </div>
                <button id="btn-save-lead-info" class="btn btn-primary" style="margin-top: 8px; justify-content: center;">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Auth Check & Core Scripts -->
    <script src="supabase.js"></script>
    <script src="lead-details.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('mobile-menu-btn');
            const sidebar = document.querySelector('.sidebar');
            if (menuBtn && sidebar) {
                menuBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('mobile-open');
                });
                
                // Close sidebar when clicking outside
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768 && !sidebar.contains(e.target) && !menuBtn.contains(e.target) && sidebar.classList.contains('mobile-open')) {
                        sidebar.classList.remove('mobile-open');
                    }
                });
            }
        });
    </script>
    <script src="push.js"></script>
</body>

</html>
