<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PQD CRM">
    <title>Login - PQD Remodels</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=7">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- iOS PWA Link Fix -->
    <script>
        if (("standalone" in window.navigator) && window.navigator.standalone) {
            document.addEventListener('click', function(e) {
                var a = e.target.closest('a');
                if (a && a.href && !a.hasAttribute('download') && a.target !== '_blank') {
                    e.preventDefault();
                    window.location = a.href;
                }
            }, false);
        }
    </script>
    <script type="module" src="https://cdn.skypack.dev/@hotwired/turbo"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg-color);">
    
    <div class="card" style="width: 400px; padding: 32px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <div class="logo" style="justify-content: center; margin-bottom: 32px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Flame_icon.svg" alt="Flame" class="logo-icon" width="32" height="32" style="filter: invert(65%) sepia(85%) saturate(1915%) hue-rotate(345deg) brightness(102%) contrast(105%);">
            <span class="logo-text" style="font-size: 24px;">PQD Remodels</span>
        </div>
        
        <h2 style="margin-bottom: 24px; font-weight: 600;">Sign In</h2>
        
        <form id="login-form">
            <div class="form-group" style="text-align: left;">
                <label>Email</label>
                <input type="email" id="email" required placeholder="name@company.com">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <p id="error-message" style="color: #ef4444; font-size: 12px; margin-bottom: 16px; display: none;"></p>
            <p id="success-message" style="color: #4caf50; font-size: 12px; margin-bottom: 16px; display: none;"></p>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px;">Sign In</button>
            <button type="button" id="signup-btn" class="btn btn-outline" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px; margin-top: 12px;">Create Account</button>
        </form>
    </div>

    <script src="supabase.js?v=3"></script>
    <script src="login.js?v=3"></script>

    <script>
        document.addEventListener('app:init', () => {
            const menuBtn = document.getElementById('mobile-menu-btn');
            const sidebar = document.querySelector('.sidebar');
            if (menuBtn && sidebar) {
                menuBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('mobile-open');
                });
                
                // Close sidebar when clicking outside
                document.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768 && !sidebar.contains(e.target) && !menuBtn.contains(e.target) && sidebar.classList.contains('mobile-open')) {
                        sidebar.classList.remove('mobile-open');
                    }
                });
            }
        });
    </script>
    <script src="push.js"></script>
<script>document.dispatchEvent(new Event('app:init'));</script>

    <!-- Bottom Navigation (Mobile Only) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item" onclick="event.preventDefault(); window.Turbo ? window.Turbo.visit('index.html') : window.location.href='index.html'">
            <i class="fa-solid fa-house"></i>
        </a>
        <a href="messages.html" class="nav-item new-chat-btn" onclick="event.preventDefault(); window.Turbo ? window.Turbo.visit('messages.html') : window.location.href='messages.html'">
            <i class="fa-solid fa-plus"></i> New Chat
        </a>
        <a href="settings.html" class="nav-item" onclick="event.preventDefault(); window.Turbo ? window.Turbo.visit('settings.html') : window.location.href='settings.html'">
            <i class="fa-regular fa-user"></i>
        </a>
    </nav>


    <!-- Bottom Nav Modal -->
    <div id="new-chat-modal" class="bottom-sheet-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:2000; flex-direction:column; justify-content:flex-end;">
        <div class="bottom-sheet-content" style="background:transparent; padding:16px; border-radius:24px 24px 0 0; animation: slideUp 0.3s ease-out; margin-bottom: 24px;">
            <div style="background:white; border-radius:24px; padding:8px 0; margin-bottom:16px;">
                <div class="sheet-action" style="display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid #f0f0f0;">
                    <i class="fa-regular fa-message" style="font-size:20px; color:#333;"></i>
                    <div>
                        <div style="font-weight:600; color:#000; font-size:16px;">New Chat</div>
                        <div style="font-size:12px; color:#888;">Send a message to your contact</div>
                    </div>
                </div>
                <div class="sheet-action" style="display:flex; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid #f0f0f0;">
                    <i class="fa-solid fa-address-book" style="font-size:20px; color:#333;"></i>
                    <div>
                        <div style="font-weight:600; color:#000; font-size:16px;">New Contact</div>
                        <div style="font-size:12px; color:#888;">Add a contact to be able to send messages</div>
                    </div>
                </div>
                <div class="sheet-action" style="display:flex; align-items:center; gap:16px; padding:16px 24px;">
                    <i class="fa-solid fa-user-group" style="font-size:20px; color:#333;"></i>
                    <div>
                        <div style="font-weight:600; color:#000; font-size:16px;">New Community</div>
                        <div style="font-size:12px; color:#888;">Join the community around you</div>
                    </div>
                </div>
            </div>
            
            <button id="close-modal-btn" style="width:100%; background:white; border:none; padding:16px; border-radius:30px; font-size:16px; font-weight:600; color:#000;">Cancel</button>
        </div>
    </div>
    
    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
    
    <script>
        document.addEventListener('app:init', () => {
            const newChatBtns = document.querySelectorAll('.new-chat-btn');
            const modal = document.getElementById('new-chat-modal');
            const closeBtn = document.getElementById('close-modal-btn');
            
            if (modal) {
                newChatBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        modal.style.display = 'flex';
                    });
                });
                
                if (closeBtn) {
                    closeBtn.addEventListener('click', () => {
                        modal.style.display = 'none';
                    });
                }
                
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        modal.style.display = 'none';
                    }
                });
            }
        });
    </script>

</body>

</html>
