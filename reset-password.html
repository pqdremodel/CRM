<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="turbo-visit-control" content="reload">
    <meta name="turbo-cache-control" content="no-cache">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PQD CRM">
    <title>Reset Password - PQD Remodels</title>
    <meta name="referrer" content="no-referrer">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=7">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- iOS PWA Link Fix -->
    <script>
        if (("standalone" in window.navigator) && window.navigator.standalone) {
            document.addEventListener('click', function(e) {
                var a = e.target.closest('a');
                if (a && a.href && !a.hasAttribute('download') && a.target !== '_blank') {
                    e.preventDefault();
                    window.location = a.href;
                }
            }, false);
        }
    </script>
    <link rel="stylesheet" href="home.css?v=1">
    <link rel="stylesheet" href="app-theme.css?v=2">
    <meta name="theme-color" content="#000000">
</head>
<body class="crm-page page-login">
    <main class="card" style="text-align: center;">
        <div class="logo" style="justify-content: center; margin-bottom: 32px;">
            <span class="home-monogram" aria-hidden="true">PQD</span>
            <span class="logo-text">PQD Remodels</span>
        </div>
        <h2 id="reset-title" style="margin-bottom: 16px;">Reset your password</h2>
        <p id="reset-description" style="margin-bottom: 24px;">Enter your email and we’ll send you a password reset link.</p>
        <p id="reset-error" role="alert" style="color: #ef4444;" hidden></p>
        <p id="reset-success" role="status" style="color: #4caf50;" hidden></p>
        <form id="request-form">
            <div class="form-group" style="text-align: left;">
                <label for="reset-email">Email</label>
                <input type="email" id="reset-email" autocomplete="email" required placeholder="name@company.com">
            </div>
            <button class="btn btn-primary" type="submit" style="width: 100%; justify-content: center;">Send reset link</button>
        </form>
        <form id="update-form" hidden>
            <div class="form-group" style="text-align: left;">
                <label for="new-password">New password</label>
                <input type="password" id="new-password" autocomplete="new-password" minlength="8" required aria-describedby="password-hint">
                <small id="password-hint">Use at least 8 characters.</small>
            </div>
            <div class="form-group" style="text-align: left;">
                <label for="confirm-password">Confirm new password</label>
                <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required>
            </div>
            <button class="btn btn-primary" type="submit" style="width: 100%; justify-content: center;">Save new password</button>
        </form>
        <p style="margin-top: 24px;"><a href="login.html">Back to sign in</a></p>
    </main>
    <script src="reset-password.js?v=2"></script>
    <script src="supabase.js?v=20261111-live-1"></script>
    <script>document.dispatchEvent(new Event('app:init'));</script>
</body>
</html>
